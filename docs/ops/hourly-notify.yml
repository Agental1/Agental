# Round 9, group 6: the hourly run of the automatic emails (Vercel Hobby
# allows daily crons only). Calls the production endpoint with the same
# CRON_SECRET as Vercel, stored as a GitHub Actions secret (founder action:
# GitHub > Agental1/Agental > Settings > Secrets and variables > Actions >
# New repository secret, name CRON_SECRET). Without the secret the job only
# prints a note and succeeds: nothing is called.
name: Hourly automatic emails

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call /api/cron/notify
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not set in GitHub Actions secrets: skipped."
            exit 0
          fi
          code=$(curl -s -o /tmp/out.json -w "%{http_code}" --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" https://www.agental.co/api/cron/notify)
          # Only the status: the logs of a public repository are public.
          echo "HTTP $code"
          [ "$code" = "200" ] || [ "$code" = "404" ]
